name: Publish test release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.0.1-test.4"
      source_ref:
        description: "Branch or commit to build"
        required: true
        default: "feature/m1-virtual-camera"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-test-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    env:
      DEFAULT_TAG: v0.0.1-test.4
      DEFAULT_SOURCE_REF: feature/m1-virtual-camera
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Select release inputs
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_TAG=${{ inputs.tag }}" >> $env:GITHUB_ENV
            "SOURCE_REF=${{ inputs.source_ref }}" >> $env:GITHUB_ENV
          } else {
            "RELEASE_TAG=$env:DEFAULT_TAG" >> $env:GITHUB_ENV
            "SOURCE_REF=$env:DEFAULT_SOURCE_REF" >> $env:GITHUB_ENV
          }

      - name: Checkout test source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Configure
        run: cmake -S windows -B windows/build -A x64

      - name: Build
        run: cmake --build windows/build --config Release

      - name: Register virtual camera smoke test
        shell: pwsh
        run: |
          $dll = "$pwd\windows\build\Release\FreeCamVirtualCamera.dll"
          $process = Start-Process -FilePath "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList @("/s", $dll) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "regsvr32 failed with exit code $($process.ExitCode)"
          }

      - name: Verify virtual camera enumeration
        run: windows\build\Release\FreeCamCameraProbe.exe

      - name: Unregister virtual camera after smoke test
        if: always()
        shell: pwsh
        run: |
          $dll = "$pwd\windows\build\Release\FreeCamVirtualCamera.dll"
          if (Test-Path $dll) {
            Start-Process -FilePath "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList @("/s", "/u", $dll) -Wait | Out-Null
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FreeCam | Out-Null
          Copy-Item windows/build/Release/FreeCamReceiver.exe dist/FreeCam/
          Copy-Item windows/build/Release/FreeCamVirtualCamera.dll dist/FreeCam/
          Copy-Item windows/virtualcam/install-camera.cmd dist/FreeCam/
          Copy-Item windows/virtualcam/uninstall-camera.cmd dist/FreeCam/

          @"
          FreeCam test.4

          1. Keep all files together in this folder.
          2. Right-click install-camera.cmd and choose Run as administrator.
          3. Run FreeCamReceiver.exe.
          4. Connect FreeCamIP on the iPhone and start the camera.
          5. Restart OBS, Discord, your browser, or other camera app if it was already open.
          6. Select "FreeCam Camera" as the video device.

          Do not move or delete FreeCamVirtualCamera.dll while the camera is registered.
          Run uninstall-camera.cmd as administrator before deleting or moving this folder.
          "@ | Set-Content -Encoding UTF8 dist/FreeCam/README.txt

          Compress-Archive -Path dist/FreeCam/* -DestinationPath dist/FreeCam-windows-x64.zip -Force

      - name: Publish prerelease
        shell: pwsh
        run: |
          $notes = @"
          FreeCam test.4 — browser/Discord compatibility build.

          Changes since test.3:
          - virtual camera now exposes NV12, I420, YUY2 and RGB32
          - NV12 is the default negotiated format
          - live DirectShow source now reports VFW_S_CANT_CUE while paused, as required for capture devices
          - CI now builds and runs a real DirectShow capture graph
          - CI verifies every advertised capture format

          Usage:
          1. Extract the ZIP and keep the files together.
          2. Run install-camera.cmd as Administrator.
          3. Run FreeCamReceiver.exe and connect the iPhone.
          4. Select FreeCam Camera in OBS/Discord/browser.

          This is still a development prerelease. The DirectShow camera is currently x64 only.

          test.4 specifically targets apps that rejected the RGB32-only test.3 camera, including Firefox/WebRTC and Discord.
          "@

          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" dist/FreeCam-windows-x64.zip --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:RELEASE_TAG" dist/FreeCam-windows-x64.zip --target "$env:SOURCE_REF" --title "FreeCam $env:RELEASE_TAG" --notes "$notes" --prerelease --repo "$env:GITHUB_REPOSITORY"
          }
