name: Windows receiver

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-receiver.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-receiver.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S windows -B windows/build -A x64

      - name: Build
        run: cmake --build windows/build --config Release

      - name: Register virtual camera
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList @("/s", "$pwd\windows\build\Release\FreeCamVirtualCamera.dll") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "regsvr32 failed with exit code $($process.ExitCode)"
          }

      - name: Verify virtual camera enumeration
        run: windows\build\Release\FreeCamCameraProbe.exe

      - name: Unregister virtual camera
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "windows\build\Release\FreeCamVirtualCamera.dll") {
            $process = Start-Process -FilePath "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList @("/s", "/u", "$pwd\windows\build\Release\FreeCamVirtualCamera.dll") -Wait -PassThru
            Write-Host "Unregister exit code: $($process.ExitCode)"
          }

      - name: Stage Windows test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/dist | Out-Null
          Copy-Item windows/build/Release/FreeCamReceiver.exe windows/dist/
          Copy-Item windows/build/Release/FreeCamVirtualCamera.dll windows/dist/
          Copy-Item windows/virtualcam/install-camera.cmd windows/dist/
          Copy-Item windows/virtualcam/uninstall-camera.cmd windows/dist/

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: FreeCam-windows-x64
          path: windows/dist/*
          retention-days: 14
